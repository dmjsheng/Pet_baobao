<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>爆爆桌面宠物</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="pet-app" aria-label="爆爆桌面宠物">
      <p id="bubble" class="bubble" aria-live="polite"></p>
      <button id="pet" class="pet" aria-label="抚摸爆爆"><img id="pet-image" alt="爆爆，一只蓝眼暹罗猫" /></button>
      <nav id="actions" class="actions" aria-label="爆爆互动">
        <button data-action="feed">喂食</button>
        <button data-action="companion">陪伴</button>
        <button data-action="sleep">睡觉</button>
      </nav>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
